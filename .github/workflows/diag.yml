name: Diagnose steamcmd

on:
  push:
    branches:
      - diag-steamcmd

jobs:
  home:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: steamcmd with a per-run HOME
        run: |
          D="$RUNNER_TEMP/steamcmd"; H="$RUNNER_TEMP/steam-home"; mkdir -p "$D" "$H"; cd "$D"
          case "$RUNNER_OS" in
            Linux) curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz ;;
            macOS) curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_osx.tar.gz | tar -xz ;;
          esac
          set +e
          HOME="$H" ./steamcmd.sh +quit > out.txt 2>&1; echo "rc=$?"; tail -2 out.txt
          echo "--- per-run HOME"; find "$H" -maxdepth 4 -type d | head -20
          echo "--- real HOME"; ls -d ~/Steam ~/.steam ~/"Library/Application Support/Steam" 2>&1

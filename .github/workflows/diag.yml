name: Diagnose steamcmd

on:
  push:
    branches:
      - diag-steamcmd

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Runner info
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          docker version --format 'docker={{.Server.Version}}'
          dpkg -l | grep -E "lib32gcc|libc6-i386|lib32stdc" || echo "no 32-bit libs"
      - name: Native steamcmd
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
          set +e
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit
          echo "native rc=$?"
      - name: cm2network/steamcmd image (game-ci/cli docker mode)
        run: |
          set +e
          docker run --rm cm2network/steamcmd:latest /home/steam/steamcmd/steamcmd.sh +quit 2>&1 | tail -5
          echo "cm2network rc=${PIPESTATUS[0]}"
